<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CrossVerse Profile</title>

<style>

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

    font-family:Arial, sans-serif;

}

body{

    background:#0b1020;

    color:white;

}

.banner{

    height:220px;

    background:linear-gradient(135deg,#00d9ff,#5b21b6);

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:40px;

    font-weight:bold;

}

.profile{

    max-width:1000px;

    margin:-60px auto 40px;

    padding:20px;

}

.avatar{

    width:120px;

    height:120px;

    border-radius:50%;

    background:#18233b;

    border:4px solid #00d9ff;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:50px;

    margin:auto;

}

.card{

    background:#18233b;

    border:1px solid rgba(0,217,255,.4);

    border-radius:15px;

    padding:25px;

    margin-top:25px;

    box-shadow:0 0 20px rgba(0,217,255,.15);

}

h1,h2{

    color:#00d9ff;

    text-align:center;

}

p{

    margin:10px 0;

}

.stats{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));

    gap:15px;

    text-align:center;

    margin-top:20px;

}

.stat{

    background:#111827;

    padding:20px;

    border-radius:10px;

}

button{

    background:#00d9ff;

    color:black;

    border:none;

    padding:12px 20px;

    border-radius:8px;

    font-weight:bold;

    cursor:pointer;

    margin-top:15px;

}

.music{

    text-align:center;

}

</style>

</head>

<body>

<div class="banner">

CrossVerse

</div>

<div class="profile">

<div class="avatar">

🎮

</div>

<div class="card">

h1>Player Profile</h1>

<p><strong>Username:</strong> <span id="username">Loading...</span></p>

<p><strong>Bio:</strong> <span id="bio">No bio yet.</span></p>

<p><strong>Favorite Game:</strong> <span id="favoriteGame">None</span></p>

<p><strong>Platform:</strong> <span id="platform">Unknown</span></p>

<p><strong>Clan:</strong> <span id="clan">No Clan</span></p>

<button>Edit Profile</button>

</div>

<div class="card">

<h2>Player Stats</h2>

<div class="stats">

<div class="stat">

<h3>Reputation</h3>

<p id="reputation">0</p>



</div>

<div class="stat">

<h3>Reputation</h3>

<p>0</p>

</div>

<div class="stat">

<h3>Wins</h3>

<p>0</p>

</div>

<div class="stat">

<h3>K/D</h3>

<p>0.00</p>

</div>

</div>

</div>

<div class="card music">

<h2>🎵 Profile Music</h2>

<p>No song selected yet.</p>

<button>Choose Music</button>

</div>

</div>

</body>

</html>
